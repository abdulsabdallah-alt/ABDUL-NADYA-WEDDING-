<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdul & Radhia — QR Check-in</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;color:#173f35}
.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 4px 18px #0001}
h1{margin:0}.muted{color:#666}
button{width:100%;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:bold;margin-top:10px}
.green{background:#173f35;color:white}.gray{background:#e8eeeb;color:#173f35}
video{width:100%;border-radius:15px;background:#111;margin-top:15px;display:none}
.result{padding:18px;border-radius:14px;margin-top:15px;display:none}
.valid{background:#e8f7ec;border:2px solid #26934a;color:#145d2d}
.used{background:#fdeaea;border:2px solid #b52b2b;color:#7e1515}
.invalid{background:#fff2e5;border:2px solid #d97918;color:#81450d}
.stat{display:flex;gap:8px}.box{flex:1;text-align:center;background:#eef2f0;border-radius:12px;padding:12px}.n{font-size:25px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>ABDUL & RADHIA</h1>
<div class="muted">QR Guest Check-in • 15 November 2026</div>
</div>

<div class="card">
<div class="stat">
<div class="box"><div class="n" id="total">5</div>Mialiko</div>
<div class="box"><div class="n" id="checked">0</div>Checked-in</div>
<div class="box"><div class="n" id="people">0</div>Watu</div>
</div>
</div>

<div class="card">
<h2>Scan QR Code</h2>
<div class="muted">Bonyeza kitufe, ruhusu camera, kisha elekeza camera kwenye QR ya kadi.</div>
<button class="green" onclick="startScanner()">📷 SCAN QR CODE</button>
<button class="gray" onclick="stopScanner()">STOP CAMERA</button>
<video id="video" playsinline></video>
<div id="result" class="result"></div>
</div>

<div class="card">
<h3>Test bila camera</h3>
<div class="muted">Kama camera haijafunguka, unaweza kuandika Invitation ID hapa.</div>
<input id="manual" placeholder="A00125" style="width:100%;box-sizing:border-box;padding:15px;border:1px solid #ccc;border-radius:12px;font-size:19px;margin-top:10px;text-transform:uppercase">
<button class="gray" onclick="verify(document.getElementById('manual').value)">VERIFY ID</button>
</div>
</div>

<script>
const guests=[
{id:"A00125",name:"Mr & Mrs Jackson",type:"Double",count:2},
{id:"A00126",name:"Miss Benaziri",type:"Double",count:2},
{id:"A00127",name:"Mr & Mrs Ahmed",type:"Double",count:2},
{id:"A00128",name:"Mr Hassan Suleiman",type:"Single",count:1},
{id:"A00129",name:"Miss Amina Omar",type:"Single",count:1}
];
let used=JSON.parse(localStorage.getItem("ar_used")||"{}");
let stream=null, timer=null;

function render(){
 let c=0,p=0;
 guests.forEach(g=>{if(used[g.id]){c++;p+=g.count}});
 document.getElementById("checked").textContent=c;
 document.getElementById("people").textContent=p;
}
function show(cls,html){
 const r=document.getElementById("result");r.className="result "+cls;r.innerHTML=html;r.style.display="block";
}
function verify(raw){
 let s=String(raw||"").toUpperCase().trim();
 // Extract A00xxx from either plain text or the full QR payload.
 const m=s.match(/A\d{5}/); const id=m?m[0]:s;
 const g=guests.find(x=>x.id===id);
 if(!g){show("invalid","<b>🟠 INVALID INVITATION</b><br><br>QR/Invitation ID haipo kwenye guest list.");return;}
 if(used[id]){
  show("used",`<b>🔴 ALREADY USED</b><br><br><b>${g.name}</b><br>${g.type} • ${g.count} guest(s)<br>Invitation: ${id}<br><br>Kadi hii tayari imetumika.`);
  return;
 }
 show("valid",`<b>🟢 VALID INVITATION</b><br><br><b>${g.name}</b><br>${g.type} • ${g.count} guest(s)<br>Invitation: ${id}<br><button class="green" onclick="checkIn('${id}')">CHECK-IN / RUHUSU KUINGIA</button>`);
}
function checkIn(id){
 used[id]={time:new Date().toLocaleString()};
 localStorage.setItem("ar_used",JSON.stringify(used));
 render(); verify(id);
}
async function startScanner(){
 if(!("BarcodeDetector" in window)){
  show("invalid","<b>Camera QR scanner haijawezeshwa kwenye browser hii.</b><br><br>Tumia browser yenye BarcodeDetector/QR support, au tumia sehemu ya VERIFY ID kwa prototype hii.");
  return;
 }
 try{
  const detector=new BarcodeDetector({formats:["qr_code"]});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  const v=document.getElementById("video");v.srcObject=stream;v.style.display="block";await v.play();
  timer=setInterval(async()=>{
   try{
    const codes=await detector.detect(v);
    if(codes.length){verify(codes[0].rawValue);stopScanner();}
   }catch(e){}
  },350);
 }catch(e){
  show("invalid","<b>Camera imekataliwa au haipatikani.</b><br><br>Ruhusu Camera kwenye browser. Kumbuka: browser nyingi zinahitaji ukurasa wa HTTPS ili camera ifanye kazi.");
 }
}
function stopScanner(){
 if(timer){clearInterval(timer);timer=null}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const v=document.getElementById("video");v.pause();v.srcObject=null;v.style.display="none";
}
render();
</script>
</body>
</html>
