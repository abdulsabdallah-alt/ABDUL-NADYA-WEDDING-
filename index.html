<!doctype html><html lang="sw"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABDUL & NADYA — Wedding Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f5f5f5;color:#171717}
main{max-width:560px;margin:auto;padding:20px 16px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0001}
h1{text-align:center;margin:0 0 5px}.sub{text-align:center;color:#666;margin:0 0 20px}
#reader{width:100%;overflow:hidden;border-radius:16px}button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#1f8f4c;color:#fff;margin-top:12px}
.secondary{background:#222}#result{display:none;text-align:center;border-radius:18px;padding:20px;margin-top:18px}
.valid{display:block!important;background:#e9f8ef;border:2px solid #2e9f59}.used{display:block!important;background:#fff0f0;border:2px solid #d63b3b}
.invalid{display:block!important;background:#fff7e8;border:2px solid #e09a20}.status{font-size:29px;font-weight:800}.name{font-size:21px;font-weight:700;margin:8px}
.manual{display:flex;gap:8px;margin-top:12px}.manual input{flex:1;border:1px solid #ccc;border-radius:12px;padding:14px;font-size:17px;text-transform:uppercase}.manual button{width:auto;margin:0}
</style></head><body><main><div class="card">
<h1>ABDUL & NADYA</h1><p class="sub">Wedding Guest Check-in</p>
<div id="reader"></div><button id="start" onclick="startScanner()">📷 ANZA KUSCAN QR</button>
<button id="stop" class="secondary" onclick="stopScanner()" style="display:none">⏹ SIMAMISHA CAMERA</button>
<div class="manual"><input id="manualId" placeholder="Mfano: A00125"><button onclick="checkManual()">CHECK</button></div>
<div id="result"></div></div></main>
<script>
const URL='https://whxmzhanjksmbtmsyorv.supabase.co';
const KEY='sb_publishable_AAnEo4XB4zletaAXE1Socw_k5KnXsSD';
const db=supabase.createClient(URL,KEY);let scanner=null,running=false;
function idOf(x){const t=String(x||'').toUpperCase().trim(),m=t.match(/\bA\d{5}\b/);return m?m[0]:t}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(r){let b=document.getElementById('result');b.className='';b.style.display='block';
if(!r||r.status==='INVALID'){b.className='invalid';b.innerHTML='<div class="status">⚠️ INVALID</div><div>Invitation ID haipo kwenye database.</div>';return}
if(r.status==='VALID'){b.className='valid';b.innerHTML=`<div class="status">✅ VALID</div><div class="name">${esc(r.guest_name)}</div><div>Invitation: <b>${esc(r.invitation_id)}</b></div><div>Wageni: <b>${r.guest_count}</b></div>`;return}
if(r.status==='ALREADY_USED'){b.className='used';b.innerHTML=`<div class="status">🔴 ALREADY USED</div><div class="name">${esc(r.guest_name)}</div><div>Invitation: <b>${esc(r.invitation_id)}</b></div><div>Kadi hii tayari ime-check-in.</div>`;return}
b.className='invalid';b.innerHTML='<div class="status">⚠️ ERROR</div><div>Imeshindikana kuwasiliana na database.</div>'}
async function check(raw){const id=idOf(raw);if(!id)return;try{const {data,error}=await db.rpc('check_in_guest',{p_invitation_id:id});if(error){console.error(error);show({status:'ERROR'});return}show(data&&data[0])}catch(e){console.error(e);show({status:'ERROR'})}}
async function startScanner(){if(running)return;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async t=>{await stopScanner();await check(t)},()=>{});running=true;start.style.display='none';stop.style.display='block'}catch(e){alert('Camera haijaanza. Ruhusu Camera na hakikisha website ni HTTPS.');scanner=null}}
async function stopScanner(){if(scanner&&running){try{await scanner.stop()}catch(e){}}running=false;start.style.display='block';stop.style.display='none'}
function checkManual(){check(document.getElementById('manualId').value)}
</script></body></html>
